name: test

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Neovim stable
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch libnotmuch-dev w3m

      - name: Show tool versions
        run: |
          nvim --version | head -n 3
          notmuch --version

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua ftplugin tests

      - name: Run test suite
        run: make check
